[tools]
python = "3.13"
uv = "0.10.4"
betterleaks = "1.10.1"

[tasks.test]
run = "uv run pytest -q"

[tasks.lint]
run = "uv run ruff check . && uv run ruff format --check ."

# betterleaks takes gitleaks' command line and its JSON output. This repository has
# no .gitleaks.toml, so the scans below run the built-in rules; if one is ever
# added, every scan must pass `--config .gitleaks.toml`, because betterleaks loads
# that file only when a scan asks for it.
[tasks.leaks]
run = "betterleaks dir . --redact --no-banner && betterleaks git . --redact --no-banner"

[tasks."leaks:staged"]
run = "betterleaks git --staged --redact --no-banner ."

[tasks.ci]
depends = ["lint", "test", "leaks"]
run = "echo 'ci passed'"
